<style>

--kuning-teks:#7A5300;--biru-bg:#EEF2FA;--r:16px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
a{color:var(--navy)}
button{font-family:inherit;color:inherit}
.app{max-width:520px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:100dvh;background:var(--bg)}
header{position:sticky;top:0;z-index:5;background:var(--kartu);padding:calc(14px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--garis);
display:flex;align-items:center;justify-content:space-between;gap:10px}
.salam{display:flex;flex-direction:column;gap:2px;min-width:0}

.tombol-ikon{width:40px;height:40px;border-radius:12px;border:1px solid var(--garis);background:var(--kartu);display:flex;align-items:center;justify-content:center;cursor:pointer}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--kartu);border-top:1px solid var(--garis);padding:6px 4px calc(10px + env(safe-area-inset-bottom))}

font-size:14px;font-weight:700;text-align:left;cursor:pointer;margin-top:8px}

.layar{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px 20px 40px;max-width:440px;margin:0 auto;width:100%}
.layar h1{font-size:24px;font-weight:800;margin:0;line-height:1.25}
.layar p{margin:0;font-size:14.5px;line-height:1.6;color:#2A3650}
.langkah{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5}
.langkah i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--navy);color:var(--emas);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}

.lembar-latar.buka{display:flex}

.pegangan{width:40px;height:5px;border-radius:3px;background:#D9DEE7;margin:4px auto 12px}
.lembar h3{font-size:19px;font-weight:800;margin:0 0 4px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;margin:14px 0}
.dl dt{color:var(--redup);font-weight:600}
.dl dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.garis-waktu{border-left:2px solid var(--garis);margin:8px 0 0 6px;padding-left:14px}
.garis-waktu div{position:relative;font-size:13px;padding:0 0 12px;line-height:1.45}
.garis-waktu div::before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--navy)}
.pasang{background:var(--navy);color:#fff;border-radius:var(--r);padding:12px 14px;display:none;align-items:center;gap:12px}
.pasang.tampil{display:flex}
.pasang span{flex:1;font-size:13px;font-weight:600;line-height:1.4}
.pasang button{background:var(--emas);color:var(--navy);border:0;border-radius:10px;font-weight:800;padding:10px 12px;font-size:13px;cursor:pointer}
.offline{background:#FDECEA;color:var(--merah);font-size:12px;font-weight:700;border-radius:12px;padding:8px 12px}
.pesan-kecil{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;
font-size:13px;font-weight:700;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.pesan-kecil.tampil{opacity:1}
@media (min-width:600px){main{padding-top:20px}}
</style>

<body>
<div class="app">

<nav id="menu" hidden>

    <a href="#ringkasan" data-v="ringkasan"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Ringkasan</a>
    <a href="#klien" data-v="klien"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11l2 2 4-4"/></svg>Klien</a>

    <a href="#iklan" data-v="iklan"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1zM17 8a5 5 0 0 1 0 8"/></svg>Iklan</a>
    <a href="#agen" data-v="agen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg>Agen</a>

<script>
"use strict";
const BOT = "pbc_marketing_os_bot";
const TG = "https://t.me/" + BOT;
const INFO = new TextEncoder().encode("pbc-app-v1");
const TZ = "Asia/Makassar";
const NAMA = "Pak Abraham";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let DATA = null, KUNCI = null, ID_HP = null, FILTER_KLIEN = "berjalan", OFFLINE = false;

/* ---------- format ---------- */
const nf = new Intl.NumberFormat("id-ID");
const angka = n => n == null ? "—" : nf.format(n);
const ringkas = n => n == null ? "—" : n >= 1e6 ? nf.format(Math.round(n / 1e5) / 10) + " jt" : n >= 1e4 ? nf.format(Math.round(n / 100) / 10) + " rb" : nf.format(n);
function rp(n, pendek) {
  if (n == null) return "—";
  if (!pendek) return "Rp " + nf.format(Math.round(n));
  if (n >= 1e9) return "Rp " + nf.format(Math.round(n / 1e8) / 10) + " M";
  if (n >= 1e6) return "Rp " + nf.format(Math.round(n / 1e5) / 10) + " jt";
  if (n >= 1e5) return "Rp " + nf.format(Math.round(n / 1e3)) + " rb";
  if (n >= 1e3) return "Rp " + nf.format(Math.round(n / 100) / 10) + " rb";
  return "Rp " + nf.format(n);
}
const tgl = (s, o) => s ? new Intl.DateTimeFormat("id-ID", Object.assign({timeZone: TZ}, o)).format(new Date(s.length === 10 ? s + "T12:00:00+08:00" : s)) : "—";
const tglPendek = s => tgl(s, {weekday: "short", day: "numeric", month: "short"});
const jam = s => s && s.length > 10 ? tgl(s, {hour: "2-digit", minute: "2-digit"}).replace(":", ".") : "";
const waktu = s => s ? tglPendek(s) + (s.length > 10 ? " " + jam(s) : "") : "—";
function lalu(s) {
  if (!s) return "—";
  const m = (Date.now() - new Date(s).getTime()) / 60000;
  if (m < 2) return "baru saja";
  if (m < 60) return Math.round(m) + " menit lalu";
  if (m < 48 * 60) return Math.round(m / 60) + " jam lalu";
  return Math.round(m / 1440) + " hari lalu";
}
const hariWita = () => new Intl.DateTimeFormat("en-CA", {timeZone: TZ}).format(new Date());
function toast(t) { const e = $("#pesan-kecil"); e.textContent = t; e.classList.add("tampil"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("tampil"), 2600); }

/* ---------- kunci HP (X25519, kunci pribadi tidak bisa dikeluarkan) ---------- */
const b64 = u8 => btoa(String.fromCharCode(...u8)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0));
function db() {
  return new Promise((ok, gagal) => {
    const r = indexedDB.open("pbc-app", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kunci");
    r.onsuccess = () => ok(r.result); r.onerror = () => gagal(r.error);
  });
}
async function simpanKunci(v) { const d = await db(); return new Promise((ok, g) => { const t = d.transaction("kunci", "readwrite"); t.objectStore("kunci").put(v, "hp"); t.oncomplete = ok; t.onerror = () => g(t.error); }); }
async function bacaKunci() { const d = await db(); return new Promise((ok, g) => { const r = d.transaction("kunci").objectStore("kunci").get("hp"); r.onsuccess = () => ok(r.result); r.onerror = () => g(r.error); }); }
async function hapusKunci() { const d = await db(); return new Promise(ok => { const t = d.transaction("kunci", "readwrite"); t.objectStore("kunci").delete("hp"); t.oncomplete = ok; }); }
async function idDari(pubRaw) { const h = new Uint8Array(await crypto.subtle.digest("SHA-256", pubRaw)); return [...h].map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 16); }
async function siapkanKunci() {
  let k = await bacaKunci().catch(() => null);
  if (!k) {
    const p = await crypto.subtle.generateKey({name: "X25519"}, false, ["deriveBits"]);
    const pub = new Uint8Array(await crypto.subtle.exportKey("raw", p.publicKey));
    k = {priv: p.privateKey, pub: b64(pub), dibuat: new Date().toISOString()};
    await simpanKunci(k);
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  }
  KUNCI = k; ID_HP = await idDari(unb64(k.pub));
  return k;
}
async function buka(amplop) {
  const e = amplop.perangkat.find(x => x.id === ID_HP);
  if (!e) return null;
  const epkRaw = unb64(e.epk);
  const epk = await crypto.subtle.importKey("raw", epkRaw, {name: "X25519"}, false, []);
  const bersama = await crypto.subtle.deriveBits({name: "X25519", public: epk}, KUNCI.priv, 256);
  const hk = await crypto.subtle.importKey("raw", bersama, "HKDF", false, ["deriveKey"]);
  const kek = await crypto.subtle.deriveKey({name: "HKDF", hash: "SHA-256", salt: epkRaw, info: INFO}, hk, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const dk = await crypto.subtle.decrypt({name: "AES-GCM", iv: unb64(e.iv), additionalData: INFO}, kek, unb64(e.wk));
  const k = await crypto.subtle.importKey("raw", dk, "AES-GCM", false, ["decrypt"]);
  const isi = await crypto.subtle.decrypt({name: "AES-GCM", iv: unb64(amplop.iv), additionalData: INFO}, k, unb64(amplop.ct));
  return JSON.parse(new TextDecoder().decode(isi));
}

/* ---------- ambil data ---------- */
async function ambil(paksa) {
  let amplop = null;
  try {
    const r = await fetch("data.json?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    amplop = await r.json();
    try { localStorage.setItem("pbc-amplop", JSON.stringify(amplop)); } catch (e) {}
    OFFLINE = false;
  } catch (e) {
    OFFLINE = true;
    try { amplop = JSON.parse(localStorage.getItem("pbc-amplop") || "null"); } catch (x) {}
  }
  if (!amplop) return {status: "tanpa_data"};
  const d = await buka(amplop).catch(() => null);
  if (!d) return {status: "belum_tersambung", amplop};
  return {status: "ok", data: d};
}

    <div class="judul-bagian"><h2>Klik WhatsApp</h2><span class="redup kecil">hari ini ${angka(w.hari_ini)}</span></div>
    <div class="mini"><div><b>${angka(w.tujuh)}</b><span>7 hari</span></div><div><b>${angka(w.tujuh_lalu)}</b><span>7 hari sebelumnya</span></div>
      <div><b>${angka(w.seri.reduce((a, x) => a + x.wa, 0))}</b><span>28 hari</span></div></div>
    ${batang(w.seri, "wa", 28)}
    ${w.kode.length ? `<p class="kecil" style="margin:12px 0 4px;font-weight:700">Kode link terbanyak (7 hari)</p>${w.kode.map(([k, v]) => `<div class="agenda-item" style="padding:4px 0"><span class="apa"><span class="kode">${esc(k)}</span></span><b>${v}</b></div>`).join("")}` : ""}
    <div class="sumber">${esc(w.catatan)}</div>${sumber(w.sumber, w.waktu)}
  </section>
  <section class="kartu">
    <div class="judul-bagian"><h2>Website & Google</h2></div>
    <div class="mini"><div><b>${angka(web.pengguna7)}</b><span>Pengunjung 7 hari</span></div><div><b>${angka(web.gsc_klik28)}</b><span>Klik Google 28 hari</span></div>
      <div><b>${ps.mobile ? ps.mobile.skor : "—"}</b><span>Kecepatan HP (0–100)</span></div></div>
    ${web.kueri && web.kueri.length ? `<p class="kecil" style="margin:12px 0 4px;font-weight:700">Kata yang dicari di Google (28 hari)</p>${web.kueri.slice(0, 6).map(q => `<div class="agenda-item" style="padding:4px 0"><span class="apa">${esc(q.q)}</span><span class="redup kecil">${angka(q.tayangan)} kali muncul · posisi ${String(q.posisi).replace(".", ",")}</span></div>`).join("")}` : ""}
    ${sumber(web.sumber, web.waktu)}
  </section>
  ${revisi.length || tahan.length ? `<section class="kartu"><div class="judul-bagian"><h2>Revisi & ditahan sistem</h2><span class="redup kecil">${revisi.length + tahan.length}</span></div>
    ${revisi.concat(tahan).map(p => `<details><summary>${esc(p.kode)} · ${esc(p.judul)}</summary><div class="isi-detail">
      <p><span class="pil ${p.status === "revisi" ? "kuning" : "merah"}">${esc(p.label)}</span></p>
      ${p.revisi ? `<p><b>Catatan Bapak:</b> ${esc(p.revisi)}</p>` : ""}${p.alasan ? `<p><b>Alasan ditahan:</b> ${esc(p.alasan)}</p>` : ""}</div></details>`).join("")}
    <div class="sumber">Paket ditahan otomatis bila foto buram/gelap/sudah pernah tayang, materi tidak cocok, atau data tidak lengkap. Tidak pernah terbit tanpa persetujuan Bapak.</div></section>` : ""}`;
}

/* ---------- IKLAN ---------- */
function vIklan(d) {
  const i = d.iklan, ks = i.kampanye.length ? i.kampanye : i.riwayat.map(r => ({nama: r.nama, tujuan: r.tujuan, dari: r.mulai, sampai: r.selesai, biaya: r.biaya, klik: r.klik, chat: r.chat}));
  const tb = ks.reduce((a, x) => a + (x.biaya || 0), 0), tk = ks.reduce((a, x) => a + (x.klik || 0), 0), tc = ks.reduce((a, x) => a + (x.chat || 0), 0);
  const tujuan = t => ({LINK_CLICKS: "Klik link", OUTCOME_ENGAGEMENT: "Interaksi", OUTCOME_TRAFFIC: "Kunjungan", OUTCOME_LEADS: "Prospek", MESSAGES: "Pesan WhatsApp", OUTCOME_MESSAGES: "Pesan"})[t] || t || "—";
  return `
  <section class="kartu" style="border-color:#D9DEE7">
    <div class="judul-bagian"><h2>Pilot iklan WhatsApp</h2><span class="pil abu">Belum jalan</span></div>
    <p class="kecil" style="margin:0 0 6px;line-height:1.5">${esc(i.pilot.status)}.</p>
    <div class="mini"><div><b>${rp(i.pilot.harian, 1)}</b><span>per hari</span></div><div><b>${i.pilot.hari} hari</b><span>lama uji</span></div><div><b>${rp(i.pilot.maks, 1)}</b><span>batas total</span></div></div>
    <div class="sumber">Analis iklan hanya membaca data. Tidak ada iklan dipasang atau biaya keluar tanpa persetujuan Bapak.</div>
  </section>
  <section class="kartu">
    <div class="judul-bagian"><h2>Hasil iklan sebelumnya</h2></div>
    <div class="mini"><div><b>${rp(tb, 1)}</b><span>Total biaya</span></div><div><b>${angka(tk)}</b><span>Klik link</span></div><div><b class="${tc ? "" : "turun"}">${angka(tc)}</b><span>Chat WhatsApp</span></div></div>
    ${tk ? `<p class="kecil" style="margin:10px 0 0;line-height:1.5">Biaya per klik ${rp(Math.round(tb / tk))}${tc ? `, biaya per chat WA ${rp(Math.round(tb / tc))}` : ""}. Iklan bertujuan interaksi/kunjungan hampir tidak menghasilkan chat — karena itu pilot memakai tujuan <b>Pesan WhatsApp</b>.</p>` : ""}
    <div style="margin-top:8px">${ks.map(x => `<details><summary style="font-size:13px">${esc(x.nama)}</summary><div class="isi-detail">
      <p>${esc(tujuan(x.tujuan))} · ${esc(tglPendek(x.dari))} – ${esc(tglPendek(x.sampai))}</p>
      <p>Biaya <b>${rp(x.biaya)}</b> · ${angka(x.klik)} klik · ${angka(x.chat)} chat WA${x.impresi ? " · " + angka(x.impresi) + " kali tampil" : ""}</p></div></details>`).join("") || `<div class="kosong">Belum ada data iklan.</div>`}</div>
    ${sumber(i.sumber, ks[0] && ks[0].waktu)}
  </section>
  ${agenKartu(d, "iklan")}`;
}

/* ---------- AGEN ---------- */
const statusAgen = s => ({berhasil: ["hijau", "Selesai"], berjalan: ["biru", "Berjalan"], ditolak_validasi: ["kuning", "Ditahan pemeriksa"], gagal: ["merah", "Gagal"], dilewati: ["abu", "Dilewati"], belum_jalan: ["abu", "Belum jalan"]})[s] || ["abu", s];
function agenKartu(d, kode) {
  const a = d.agen.daftar.find(x => x.kode === kode); if (!a) return "";
  return `<section class="kartu"><div class="judul-bagian"><h2>${esc(a.nama)}</h2><span class="pil ${statusAgen(a.status)[0]}">${statusAgen(a.status)[1]}</span></div>${isiAgen(a)}</section>`;
}
function isiAgen(a) {
  if (a.status === "belum_jalan") return `<p class="kecil redup" style="margin:0">Jalan pertama sesuai jadwal (Senin 05.15 WITA).</p>`;
  return `<div class="isi-detail" style="padding:0">
    <p class="redup kecil">Terakhir jalan ${esc(waktu(a.mulai))} (${esc(lalu(a.mulai))})${a.periode && a.periode[0] ? " · data " + esc(tglPendek(a.periode[0])) + "–" + esc(tglPendek(a.periode[1])) : ""}</p>
    ${a.ringkasan ? `<p>${esc(a.ringkasan)}</p>` : ""}
    ${a.rekomendasi && a.rekomendasi.length ? `<p style="font-weight:800;margin-top:10px">Usulan</p>${a.rekomendasi.map(r => `<p>• <b>${esc(r.judul)}</b>${r.tindakan ? ": " + esc(r.tindakan) : ""}${r.ukur ? `<br><span class="redup">Target: ${esc(r.ukur)}</span>` : ""}</p>`).join("")}` : ""}
    ${a.temuan && a.temuan.length ? `<details><summary style="font-size:13px">Temuan (${a.temuan.length})</summary><div class="isi-detail">${a.temuan.map(t => `<p>• <b>${esc(t.judul)}</b>: ${esc(t.isi)}</p>`).join("")}</div></details>` : ""}
  </div>`;
}
function vAgen(d) {
  const ag = d.agen, b = ag.biaya_ai, s = d.sistem;
  const pct = b.rp != null && b.batas ? Math.min(100, Math.round(100 * b.rp / b.batas)) : 0;
  const sisaToken = Math.round((new Date(s.token_meta_sampai + "T00:00:00+08:00") - new Date()) / 864e5);
  const namaKon = {ga4: "Google Analytics", gsc: "Google Search Console", meta_ads: "Meta Ads", meta_fb: "Facebook", meta_ig: "Instagram", pagespeed: "Kecepatan website", youtube: "YouTube", wa_stats: "Klik WA website"};
  const segar = w => w && (Date.now() - new Date(w)) < 36 * 3600e3;
  return `
  <section class="kartu" style="background:var(--biru-bg);border-color:#D6DFEF"><p class="kecil" style="margin:0;line-height:1.5;font-weight:600">🛡️ ${esc(ag.mode)}. Semua konten tetap menunggu tombol Setuju Bapak.</p></section>
  <section class="kartu">
    <div class="judul-bagian"><h2>Biaya AI bulan ini</h2><span class="redup kecil">batas ${rp(b.batas, 1)}</span></div>
    <div style="font-size:24px;font-weight:800">${rp(b.rp)}</div>
    <div class="progres"><i style="width:${pct}%;background:${pct >= 90 ? "var(--merah)" : pct >= 70 ? "#C98A00" : "var(--navy)"}"></i></div>
    <div class="redup kecil">${pct}% dari batas · ${angka(b.panggilan)} kali pakai AI · tidak pernah menambah saldo otomatis</div>
  </section>
  <section class="kartu"><div class="judul-bagian"><h2>Tim agen</h2><span class="redup kecil">${ag.daftar.length} agen</span></div>
    ${ag.daftar.map(a => `<details><summary><span class="titik-status" style="background:${({hijau: "var(--hijau)", merah: "var(--merah)", kuning: "#C98A00", biru: "var(--navy2)", abu: "#B5BCC9"})[statusAgen(a.status)[0]]}"></span>${esc(a.nama)}<span class="redup kecil" style="font-weight:600;margin-left:auto">${a.mulai ? esc(lalu(a.mulai)) : "belum jalan"}</span></summary>
      <div class="isi-detail"><p><span class="pil ${statusAgen(a.status)[0]}">${statusAgen(a.status)[1]}</span></p>${isiAgen(a)}</div></details>`).join("")}
  </section>
  <section class="kartu"><div class="judul-bagian"><h2>Kesehatan sistem</h2></div>
    ${s.konektor.map(k => `<div class="agenda-item"><span class="titik-status" style="margin-top:5px;background:${segar(k.terakhir) && !s.gagal_2hari[k.nama] ? "var(--hijau)" : "var(--merah)"}"></span><span class="apa">${esc(namaKon[k.nama] || k.nama)}${s.gagal_2hari[k.nama] ? ` <span class="pil merah">gagal ${s.gagal_2hari[k.nama]}x</span>` : ""}</span><span class="redup kecil">${esc(lalu(k.terakhir))}</span></div>`).join("")}
    ${s.telegram ? `<div class="agenda-item"><span class="titik-status" style="margin-top:5px;background:${s.telegram.galat ? "var(--merah)" : "var(--hijau)"}"></span><span class="apa">Bot Telegram (tombol & calon klien)</span><span class="redup kecil">${esc(lalu(s.telegram.terakhir_ok))}</span></div>` : ""}
    <div class="agenda-item"><span class="titik-status" style="margin-top:5px;background:${s.backup_terakhir >= new Date(Date.now() - 2 * 864e5).toISOString().slice(0, 10) ? "var(--hijau)" : "var(--merah)"}"></span><span class="apa">Cadangan database harian</span><span class="redup kecil">${esc(tglPendek(s.backup_terakhir))}</span></div>
    <div class="agenda-item"><span class="titik-status" style="margin-top:5px;background:${sisaToken > 21 ? "var(--hijau)" : "#C98A00"}"></span><span class="apa">Akses data Meta</span><span class="redup kecil">sisa ${sisaToken} hari</span></div>
    ${s.galat_ekspor && s.galat_ekspor.length ? `<div class="sumber turun">Bagian data yang gagal dibaca: ${esc(s.galat_ekspor.join(", "))}</div>` : ""}
  </section>`;
}

/* ---------- navigasi ---------- */
const VIEW = {ringkasan: vRingkasan, klien: vKlien, konten: vKonten, iklan: vIklan, agen: vAgen};
let gulirKe = null;
function tampil() {
  if (!DATA) return;
  const v = (location.hash || "#ringkasan").slice(1);
  const f = VIEW[v] || vRingkasan;
  kepala(DATA);
  $("#isi").innerHTML = (OFFLINE ? `<div class="offline">Tidak ada sinyal — menampilkan data terakhir (${esc(waktu(DATA.diperbarui))}).</div>` : "") + f(DATA);
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("aktif", a.dataset.v === (VIEW[v] ? v : "ringkasan")));
  pasangAksi();
  if (gulirKe && document.getElementById(gulirKe)) { document.getElementById(gulirKe).scrollIntoView({block: "start"}); gulirKe = null; } else window.scrollTo(0, 0);
}
function pasangAksi() {
  document.querySelectorAll("[data-ke]").forEach(b => b.onclick = () => {
    const ke = b.dataset.ke;
    if (ke === "telegram") { location.href = TG; return; }
    if (b.dataset.jenis === "followup") FILTER_KLIEN = "followup";
    gulirKe = b.dataset.gulir || null;
    if (location.hash === "#" + ke) tampil(); else location.hash = ke;
  });
  document.querySelectorAll("[data-lead]").forEach(b => b.onclick = () => detailLead(b.dataset.lead));
  document.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { FILTER_KLIEN = b.dataset.filter; tampil(); });
  const p = $("#pasang");
  if (p && window._promptPasang) { p.classList.add("tampil"); $("#btn-pasang").onclick = async () => { window._promptPasang.prompt(); await window._promptPasang.userChoice.catch(() => 0); window._promptPasang = null; p.classList.remove("tampil"); }; }
}
window.addEventListener("hashchange", tampil);
$("#lembar-latar").addEventListener("click", e => { if (e.target.id === "lembar-latar") tutupLembar(); });
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window._promptPasang = e; const p = $("#pasang"); if (p) pasangAksi(); });

async function mulai(manual) {
  const btn = $("#btn-segar"); btn.classList.add("putar");
  try {
    const h = await ambil(manual);
    if (h.status === "ok") {
      const baru = !DATA || DATA.diperbarui !== h.data.diperbarui;
      DATA = h.data;
      if (baru || manual) tampil();
      if (manual && !OFFLINE) toast("Data terbaru: " + waktu(DATA.diperbarui));
    } else if (h.status === "belum_tersambung" || h.status === "tanpa_data") {
      let minta = 0; try { minta = +localStorage.getItem("pbc-minta") || 0; } catch (e) {}
      layarSambung(Date.now() - minta < 3 * 864e5);
    }
  } finally { btn.classList.remove("putar"); }
}
$("#btn-segar").onclick = () => mulai(true);

(async () => {
  if (!window.crypto || !crypto.subtle) { $("#isi").innerHTML = `<div class="layar"><h1>Browser tidak didukung</h1><p>Buka alamat ini di Google Chrome terbaru.</p></div>`; return; }
  try { await siapkanKunci(); }
  catch (e) { $("#isi").innerHTML = `<div class="layar"><h1>Perlu Chrome terbaru</h1><p>HP ini belum mendukung pengaman aplikasi. Perbarui Google Chrome lewat Play Store, lalu buka lagi alamat ini.</p></div>`; return; }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  await mulai(false);
  setInterval(() => { if (document.visibilityState === "visible") mulai(false); }, 5 * 60e3);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") mulai(false); });
})();
</script>
</body>
</html>
